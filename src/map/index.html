<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'">
  <title>Nasdara · Offline map</title>
  <link rel="stylesheet" href="map.css">
</head>
<body>
  <canvas id="map" aria-label="Nasdara map"></canvas>
  <canvas id="map3d" aria-label="Nasdara 3D view" hidden></canvas>
  <div id="search">
    <input id="query" type="search" placeholder="Find loot or building…" autocomplete="off" spellcheck="false" aria-label="Find loot or building">
    <ul id="results" hidden></ul>
    <div id="selection" hidden><span id="selectionText"></span><button id="clearSelection" title="Clear (Esc)">×</button></div>
  </div>
  <div id="window"><button id="toggle3d" title="3D view" aria-pressed="false">3D</button><div id="grip" title="Drag to move window">⠿</div><button id="close" title="Close" aria-label="Close">×</button></div>
  <aside id="layers" class="closed"><button id="layersToggle" aria-expanded="false">Layers</button><div id="layerList"></div></aside>
  <button id="compass" title="Reset rotation (Numpad 1 / 3 rotate)" aria-label="Reset rotation"><span>N</span></button>
  <div id="tooltip" hidden></div>
  <div id="coords">X —  Y —</div>
  <div id="missing" hidden>Map data not built yet. Run <code>npm run build:nasdara</code> with DayZ installed, then reload.</div>
  <script src="nasdara/data.js"></script>
  <script src="loot.js"></script>
  <script src="map.js"></script>
</body>
</html>
