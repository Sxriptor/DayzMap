<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'">
  <title>DayZ · Offline map</title>
  <link rel="stylesheet" href="map.css">
</head>
<body>
  <canvas id="map" aria-label="Nasdara map"></canvas>
  <canvas id="map3d" aria-label="Nasdara 3D view" hidden></canvas>
  <div id="userPins" aria-label="Saved map points"></div>
  <div id="pinPanel" hidden role="region" aria-label="Edit saved point">
    <div class="pin-heading"><strong id="pinCoordinates"></strong><button id="closePin" aria-label="Close point editor">&times;</button></div>
    <p id="pinHint"></p>
    <div class="pin-actions"><button id="movePin" aria-pressed="false">Move point</button><button id="deletePin">Delete point</button></div>
  </div>
  <div id="search">
    <input id="query" type="search" placeholder="Find loot or building…" autocomplete="off" spellcheck="false" aria-label="Find loot or building">
    <ul id="results" hidden></ul>
    <div id="selection" hidden><span id="selectionText"></span><button id="clearSelection" title="Clear (Esc)">×</button></div>
  </div>
  <div id="window"><select id="mapSelect" title="Map" aria-label="Map" hidden></select><button id="toggle3d" title="3D view" aria-pressed="false">3D</button><button id="fullscreen" title="Full screen (F11)" aria-label="Full screen">⛶</button><div id="grip" title="Drag to move window">⠿</div><button id="close" title="Close" aria-label="Close">×</button></div>
  <aside id="layers" class="closed"><button id="layersToggle" aria-expanded="false">Layers</button><div id="layerList"></div></aside>
  <button id="compass" title="Reset rotation (Numpad 1 / 3 rotate)" aria-label="Reset rotation"><span>N</span></button>
  <div id="tooltip" hidden></div>
  <div id="coords">X —  Y —</div>
  <div id="missing" hidden>Map data not built yet. Run <code>npm run build:map</code> with DayZ installed, then reload.</div>
  <script src="maps.js"></script>
  <script src="boot.js"></script>
</body>
</html>
